syntax = "proto3";

package raft;

message LogEntry {
  uint64 term = 1;
  string command = 2;
  uint64 client_id = 3;
  uint64 request_id = 4;
}

message RequestVoteRequest {
  uint64 term = 1;
  uint64 candidate_id = 2;
  uint64 last_log_index = 3;
  uint64 last_log_term = 4;
}

message RequestVoteReply {
  uint64 term = 1;
  bool vote_granted = 2;
}

message AppendEntriesRequest {
  uint64 term = 1;
  uint64 leader_id = 2;
  uint64 prev_log_index = 3;
  uint64 prev_log_term = 4;
  repeated LogEntry entries = 5;
  uint64 leader_commit = 6;
}

message AppendEntriesReply {
  uint64 term = 1;
  bool success = 2;
  uint64 match_index = 3;
}

message ClientWriteRequest {
  string op = 1;
  string key = 2;
  string value = 3;
  uint64 client_id = 4;
  uint64 request_id = 5;
}

message ClientWriteReply {
  bool accepted = 1;
  uint64 term = 2;
  uint64 leader_id = 3;
  uint64 log_index = 4;
  uint64 commit_index = 5;
  string message = 6;
}

message ClientReadRequest {
  string key = 1;
}

message ClientReadReply {
  bool success = 1;
  bool found = 2;
  string value = 3;
  uint64 term = 4;
  uint64 leader_id = 5;
  uint64 commit_index = 6;
  string message = 7;
}

service RaftRpc {
  rpc RequestVote(RequestVoteRequest) returns (RequestVoteReply);
  rpc AppendEntries(AppendEntriesRequest) returns (AppendEntriesReply);
  rpc ClientWrite(ClientWriteRequest) returns (ClientWriteReply);
  rpc ClientRead(ClientReadRequest) returns (ClientReadReply);
}
