[package]
name = "raft_kv"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.7"
async-stream = "0.3"
futures-core = "0.3"
prost = "0.13.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.49.0", features = ["full"] }
tonic = { version = "0.12.3", features = ["transport"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
tower-http = { version = "0.6", features = ["cors"] }

[build-dependencies]
tonic-build = "0.12.3"

[lib]
name = "raft_kv"
path = "src/lib.rs"
