[package]
name = "raft_kv"
version = "0.1.0"
edition = "2024"

[dependencies]
prost = "0.13.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.49.0", features = ["full"] }
tonic = { version = "0.12.3", features = ["transport"] }

[build-dependencies]
tonic-build = "0.12.3"

[lib]
name = "raft_kv"
path = "src/lib.rs"
